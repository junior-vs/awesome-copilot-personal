<svg xmlns="http://www.w3.org/2000/svg" width="640" height="600" class="art" viewBox="0 0 640 600" role="img" aria-label="The Copilot app session details panel showing path, project, agent, changes, tokens, and context usage"><title>The Copilot app session details panel showing path, project, agent, changes, tokens, and context usage</title><style>svg{--bg:#080b12;--bg-elevated:#0d111a;--surface:#121824;--surface-2:#171e2c;--border:#283043;--border-soft:#1d2636;--text:#f1f5fb;--muted:#9ca8ba;--purple:#a371f7;--purple-bright:#bf8cff;--blue:#58a6ff;--green:#3fb950;--yellow:#d29922}@media(prefers-color-scheme:light){svg{--bg:#f7f8fb;--bg-elevated:#fff;--surface:#fff;--surface-2:#f1f3f8;--border:#d5dae5;--border-soft:#e7eaf0;--text:#161b26;--muted:#536071;--purple:#6f42c1;--purple-bright:#8250df;--blue:#0969da;--green:#1a7f37}}.art .plate{fill:var(--bg-elevated);stroke:var(--border)}.art .panel{fill:var(--surface)}.art .chip{fill:var(--bg-elevated);stroke:var(--border)}.art .rule{stroke:var(--border);stroke-width:1}.art .track{fill:var(--surface-2)}.art .fill{fill:var(--purple)}.art .fill.alt{fill:var(--blue)}.art .fill.ok{fill:var(--green)}.art .stroke{fill:none;stroke:var(--muted);stroke-width:1.2}.art .lead{stroke:var(--purple);stroke-width:1;stroke-dasharray:3 3}.art .link{fill:var(--blue)}.art .mono text,.art text.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.art text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.art .t-xs{font-size:10px}.art .t-sm{font-size:12px}.art .txt{fill:var(--text)}.art .mut{fill:var(--muted)}.art .accent{fill:var(--purple-bright)}.art .ok{fill:var(--green)}</style><rect class="plate" x="0.5" y="0.5" width="639" height="599" rx="12"/>
