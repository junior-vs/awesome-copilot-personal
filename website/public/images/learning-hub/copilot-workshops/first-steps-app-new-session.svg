<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="art" viewBox="0 0 640 300" role="img" aria-label="The Copilot app New session screen with the prompt box and folder, mode, and agent pickers"><title>The Copilot app New session screen with the prompt box and folder, mode, and agent pickers</title><style>svg{--bg:#080b12;--bg-elevated:#0d111a;--surface:#121824;--surface-2:#171e2c;--border:#283043;--border-soft:#1d2636;--text:#f1f5fb;--muted:#9ca8ba;--purple:#a371f7;--purple-bright:#bf8cff;--blue:#58a6ff;--green:#3fb950;--yellow:#d29922}@media(prefers-color-scheme:light){svg{--bg:#f7f8fb;--bg-elevated:#fff;--surface:#fff;--surface-2:#f1f3f8;--border:#d5dae5;--border-soft:#e7eaf0;--text:#161b26;--muted:#536071;--purple:#6f42c1;--purple-bright:#8250df;--blue:#0969da;--green:#1a7f37}}.art .plate{fill:var(--bg-elevated);stroke:var(--border)}.art .mark{fill:var(--surface-2);stroke:var(--border)}.art .markGlyph{fill:var(--text)}.art .input{fill:var(--surface-2);stroke:var(--border)}.art .send{fill:var(--purple)}.art .sendGlyph{stroke:#fff;stroke-width:1.6;fill:none;stroke-linecap:round}.art .card.sel{fill:color-mix(in srgb,var(--purple) 16%,var(--bg-elevated));stroke:var(--purple)}.art .stroke{fill:none;stroke:var(--muted);stroke-width:1.2}.art .dot{fill:var(--border)}.art text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.art .t-xs{font-size:10px}.art .t-sm{font-size:12px}.art .txt{fill:var(--text)}.art .mut{fill:var(--muted)}.art .accent{fill:var(--purple-bright)}</style><rect class="plate" x="0.5" y="0.5" width="639" height="299" rx="12"/>
