<rect class="fill" x="44" y="116" width="196" height="12" rx="6"/>
<rect class="fill alt" x="240" y="116" width="88" height="12" rx="6"/>
<rect class="fill warn" x="328" y="116" width="40" height="12" rx="6"/>
