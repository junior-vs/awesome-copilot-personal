<svg xmlns="http://www.w3.org/2000/svg" width="640" height="270" class="art" viewBox="0 0 640 270" role="img" aria-label="The VS Code Source Control view with the Copilot sparkle button on the commit message box"><title>The VS Code Source Control view with the Copilot sparkle button on the commit message box</title><style>svg{--bg:#080b12;--bg-elevated:#0d111a;--surface:#121824;--surface-2:#171e2c;--border:#283043;--border-soft:#1d2636;--text:#f1f5fb;--muted:#9ca8ba;--purple:#a371f7;--purple-bright:#bf8cff;--blue:#58a6ff;--green:#3fb950;--yellow:#d29922}@media(prefers-color-scheme:light){svg{--bg:#f7f8fb;--bg-elevated:#fff;--surface:#fff;--surface-2:#f1f3f8;--border:#d5dae5;--border-soft:#e7eaf0;--text:#161b26;--muted:#536071;--purple:#6f42c1;--purple-bright:#8250df;--blue:#0969da;--green:#1a7f37}}.art .plate{fill:var(--bg-elevated);stroke:var(--border)}.art .panel{fill:var(--surface)}.art .rail{fill:var(--surface-2)}.art .win{fill:var(--surface-2)}.art .card{fill:var(--bg-elevated);stroke:var(--border-soft);stroke-width:1}.art .tab.sel{fill:var(--bg-elevated);stroke:var(--purple)}.art .cta{fill:var(--purple);stroke:none}.art .cta.ghost{fill:transparent;stroke:var(--purple);stroke-dasharray:4 3}.art .sparkle{fill:var(--purple-bright)}.art .dot{fill:var(--border)}.art .dot.red{fill:#f85149}.art .dot.amber{fill:var(--yellow)}.art .dot.green{fill:var(--green)}.art text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.art .t-xs{font-size:10px}.art .t-sm{font-size:12px}.art .txt{fill:var(--text)}.art .mut{fill:var(--muted)}.art .accent{fill:var(--purple-bright)}.art .ok{fill:var(--green)}.art .inv{fill:#fff}</style><rect class="plate" x="0.5" y="0.5" width="639" height="269" rx="12"/>
<rect class="win" x="20" y="18" width="600" height="26" rx="7"/><circle class="dot red" cx="36" cy="31" r="4"/><circle class="dot amber" cx="50" cy="31" r="4"/><circle class="dot green" cx="64" cy="31" r="4"/><text class="t-xs mut" x="320" y="35" text-anchor="middle">space-quiz — Visual Studio Code</text>
<rect class="panel" x="20" y="44" width="600" height="208"/>
<rect class="rail" x="20" y="44" width="48" height="208"/>
<rect class="rail" x="68" y="44" width="252" height="208"/>
<text class="t-xs mut" x="84" y="68">SOURCE CONTROL</text>
<rect class="card" x="84" y="80" width="220" height="42" rx="8"/><text class="t-sm mut" x="98" y="106">Message (⌘Enter to commit)</text>
<g class="sparkle"><path d="M286 88c.6 3 1.7 4.5 4.7 5.1-3 .6-4.1 2.1-4.7 5.1-.6-3-1.7-4.5-4.7-5.1 3-.6 4.1-2.1 4.7-5.1Z"/><path d="M293 99c.3 1.4.8 2.1 2.2 2.4-1.4.3-1.9 1-2.2 2.4-.3-1.4-.8-2.1-2.2-2.4 1.4-.3 1.9-1 2.2-2.4Z"/></g>
<rect class="cta" x="84" y="130" width="220" height="28" rx="7"/><text class="t-sm inv" x="194" y="149" text-anchor="middle">Commit</text>
<text class="t-xs mut" x="84" y="180">CHANGES</text>
<text class="t-sm txt" x="84" y="200">index.html</text><text class="t-xs ok" x="304" y="200" text-anchor="end">M</text>
<text class="t-sm txt" x="84" y="222">.github/copilot-instructions.md</text><text class="t-xs ok" x="304" y="222" text-anchor="end">U</text>
<rect class="card" x="336" y="60" width="268" height="60" rx="8"/>
<text class="t-xs accent" x="352" y="82">Copilot wrote your message</text>
<text class="t-sm txt" x="352" y="104">Add per-question timer to the quiz</text>
<rect class="cta ghost" x="336" y="132" width="268" height="30" rx="8"/><text class="t-sm accent" x="470" y="152" text-anchor="middle">Create Pull Request</text>
<text class="t-xs mut" x="336" y="186">Commit first, then this button appears</text>
<text class="t-xs mut" x="336" y="208">right inside Source Control.</text>
</svg>