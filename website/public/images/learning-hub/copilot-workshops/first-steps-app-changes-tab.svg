<svg xmlns="http://www.w3.org/2000/svg" width="640" height="250" class="art" viewBox="0 0 640 250" role="img" aria-label="The Changes tab in the app flyout showing a file diff"><title>The Changes tab in the app flyout showing a file diff</title><style>svg{--bg:#080b12;--bg-elevated:#0d111a;--surface:#121824;--surface-2:#171e2c;--border:#283043;--border-soft:#1d2636;--text:#f1f5fb;--muted:#9ca8ba;--purple:#a371f7;--purple-bright:#bf8cff;--blue:#58a6ff;--green:#3fb950;--yellow:#d29922}@media(prefers-color-scheme:light){svg{--bg:#f7f8fb;--bg-elevated:#fff;--surface:#fff;--surface-2:#f1f3f8;--border:#d5dae5;--border-soft:#e7eaf0;--text:#161b26;--muted:#536071;--purple:#6f42c1;--blue:#0969da;--green:#1a7f37}}.art .plate{fill:var(--bg-elevated);stroke:var(--border)}.art .panel{fill:var(--surface)}.art .rail{fill:var(--surface-2)}.art .win{fill:var(--surface-2)}.art .card{fill:var(--bg-elevated);stroke:var(--border-soft);stroke-width:1}.art .tab{fill:transparent;stroke:var(--border-soft)}.art .tab.sel{fill:var(--bg-elevated);stroke:var(--purple)}.art .bubble{fill:color-mix(in srgb,var(--blue) 15%,var(--surface));stroke:color-mix(in srgb,var(--blue) 40%,transparent)}.art .fill{fill:var(--purple)}.art .diff.add{fill:color-mix(in srgb,var(--green) 16%,transparent)}.art .diff.del{fill:color-mix(in srgb,#f85149 16%,transparent)}.art .dot{fill:var(--border)}.art .dot.red{fill:#f85149}.art .dot.amber{fill:var(--yellow)}.art .dot.green{fill:var(--green)}.art .mono text,.art text.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.art text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.art .t-xs{font-size:10px}.art .t-sm{font-size:12px}.art .txt{fill:var(--text)}.art .mut{fill:var(--muted)}.art .accent{fill:var(--purple-bright)}.art .ok{fill:var(--green)}.art .bad{fill:#f85149}</style><rect class="plate" x="0.5" y="0.5" width="639" height="249" rx="12"/>
