<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" class="art" viewBox="0 0 640 300" role="img" aria-label="A Kanban canvas with issue cards, one being dragged from Backlog into Plan"><title>A Kanban canvas with issue cards, one being dragged from Backlog into Plan</title><style>svg{--bg:#080b12;--bg-elevated:#0d111a;--surface:#121824;--surface-2:#171e2c;--border:#283043;--border-soft:#1d2636;--text:#f1f5fb;--muted:#9ca8ba;--purple:#a371f7;--purple-bright:#bf8cff;--blue:#58a6ff;--green:#3fb950;--yellow:#d29922}@media(prefers-color-scheme:light){svg{--bg:#f7f8fb;--bg-elevated:#fff;--surface:#fff;--surface-2:#f1f3f8;--border:#d5dae5;--border-soft:#e7eaf0;--text:#161b26;--muted:#536071;--purple:#6f42c1;--purple-bright:#8250df;--blue:#0969da;--green:#1a7f37;--yellow:#9a6700}}.art .plate{fill:var(--bg-elevated);stroke:var(--border)}.art .panel{fill:var(--surface)}.art .win{fill:var(--surface-2)}.art .col{fill:var(--surface-2);stroke:var(--border-soft)}.art .col.drop{fill:color-mix(in srgb,var(--purple) 10%,var(--surface-2));stroke:var(--purple);stroke-dasharray:5 4}.art .card{fill:var(--bg-elevated);stroke:var(--border-soft);stroke-width:1}.art .card.sel{fill:color-mix(in srgb,var(--purple) 16%,var(--bg-elevated));stroke:var(--purple)}.art .card.ghost{fill:transparent;stroke-dasharray:4 3}.art .card.lift{filter:drop-shadow(0 10px 18px rgba(0,0,0,.3))}.art .drag{fill:none;stroke:var(--purple-bright);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.art .dot{fill:var(--border)}.art .dot.red{fill:#f85149}.art .dot.amber{fill:var(--yellow)}.art .dot.green{fill:var(--green)}.art text{font-family:Inter,ui-sans-serif,system-ui,sans-serif}.art .t-xs{font-size:10px}.art .t-sm{font-size:12px}.art .txt{fill:var(--text)}.art .mut{fill:var(--muted)}.art .accent{fill:var(--purple-bright)}</style><rect class="plate" x="0.5" y="0.5" width="639" height="299" rx="12"/>
<rect class="win" x="20" y="18" width="600" height="26" rx="7"/><circle class="dot red" cx="36" cy="31" r="4"/><circle class="dot amber" cx="50" cy="31" r="4"/><circle class="dot green" cx="64" cy="31" r="4"/><text class="t-xs mut" x="320" y="35" text-anchor="middle">Repository Issues Kanban</text>
<rect class="panel" x="20" y="44" width="600" height="238"/>
<text class="t-xs mut" x="44" y="72">BACKLOG</text><text class="t-xs accent" x="196" y="72">PLAN</text><text class="t-xs mut" x="348" y="72">READY</text><text class="t-xs mut" x="500" y="72">IMPLEMENT</text>
<rect class="col" x="36" y="82" width="140" height="180" rx="9"/><rect class="col drop" x="188" y="82" width="140" height="180" rx="9"/><rect class="col" x="340" y="82" width="140" height="180" rx="9"/><rect class="col" x="492" y="82" width="112" height="180" rx="9"/>
<rect class="card" x="46" y="94" width="120" height="52" rx="8"/><text class="t-xs mut" x="60" y="114">#12</text><text class="t-sm txt" x="60" y="132">Per-question timer</text>
<rect class="card ghost" x="46" y="158" width="120" height="52" rx="8"/><text class="t-xs mut" x="60" y="178">#13</text><text class="t-sm mut" x="60" y="196">Review screen</text>
<path class="drag" d="M172 184h40"/><path class="drag" d="M206 178l8 6-8 6"/>
<rect class="card sel lift" x="216" y="150" width="120" height="52" rx="8"/><text class="t-xs accent" x="230" y="170">#13</text><text class="t-sm txt" x="230" y="188">Review screen</text>
<text class="t-xs mut" x="36" y="278">Drop a card into a lane and the app opens a session with that issue already loaded.</text>
</svg>